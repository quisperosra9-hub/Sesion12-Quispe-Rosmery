name: CI-Pipeline

on:
  push:
    branches: ["main"]

jobs:
  verificar-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          echo "Verificando archivos del proyecto"
          test -s .github/workflows/index.html