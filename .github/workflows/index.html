<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer pipeline | Rosmery Quispe Yucra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef3f8;
            color: #172d44;
            font-family: "Inter", "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 680px;
            padding: clamp(28px, 6vw, 56px);
            background: white;
            border-top: 6px solid #087e80;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgb(23 45 68 / 10%);
        }

        .curso {
            margin: 0 0 20px;
            color: #096b6d;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0;
        }

        footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #dce5ec;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="curso">Cloud Computing · Sesión 12</p>
            <h1>Mi primer pipeline con GitHub Actions</h1>
        </header>

        <p>
            Cada vez que subo cambios a la rama <code>main</code>,
            GitHub Actions comprueba que el archivo <code>index.html</code>
            existe y tiene contenido.
        </p>

        <footer>
            <p>¡Hola! Soy <strong>Rosmery Quispe Yucra</strong>, estudiante
                de Ingeniería de Sistemas en la Universidad Autónoma del Perú.</p>
        </footer>
    </main>
</body>
</html>
